[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bluecon"
version = "0.4.3"
authors = [
  { name="Afonso Garcia", email="bluecon@afonsogarcia.dev" },
]
description = "Library for connecting to Fermax Blue supported doorbells"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiohttp",
  "python-dateutil",
  "rustPlusPushReceiver",
  # betterproto 2.0.0b5 and earlier import pkg_resources without declaring setuptools, and setuptools
  # removed pkg_resources in version 82. Later releases no longer need it.
  "betterproto>=2.0.0b7",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries"
]

[project.urls]
"Homepage" = "https://bluecon.afonsogarcia.dev"
"Bug Tracker" = "https://github.com/AfonsoFGarcia/bluecon/issues"
